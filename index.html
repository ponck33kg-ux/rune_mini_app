<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rune Oracle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-bright: #FFB700;
    --gold-dim: #8a6e2f;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    background: #0d0820;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  .bg-layer {
    position: fixed; inset: 0;
    background-image: url('https://ponck33kg-ux.github.io/rune_mini_app/bg.png');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  .helmet-layer {
    position: fixed; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 500px;
    z-index: 1; pointer-events: none;
  }
  .helmet-layer img { width: 100%; opacity: 0.4; mix-blend-mode: luminosity; }

  .fire-layer {
    position: fixed; bottom: -60px; left: 50%;
    transform: translateX(-50%);
    width: 120%; max-width: 500px;
    z-index: 2; pointer-events: none;
  }
  .fire-layer img {
    width: 100%; opacity: 0.35;
    filter: saturate(1.3) brightness(1.1);
    mix-blend-mode: screen;
    animation: fire-glow 3s ease-in-out infinite alternate;
  }
  @keyframes fire-glow {
    0%   { filter: saturate(1.2) brightness(1.0); opacity: 0.40; }
    33%  { filter: saturate(1.5) brightness(1.2); opacity: 0.48; }
    66%  { filter: saturate(1.1) brightness(0.95); opacity: 0.42; }
    100% { filter: saturate(1.4) brightness(1.15); opacity: 0.46; }
  }

  .sparks-container {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 80vh; pointer-events: none; z-index: 3;
  }

  .overlay-top {
    position: fixed; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(to bottom, rgba(8,4,20,0.7) 0%, transparent 100%);
    z-index: 4; pointer-events: none;
  }
  .overlay-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(to top, rgba(8,4,20,0.85) 0%, transparent 100%);
    z-index: 4; pointer-events: none;
  }

  .content {
    position: relative; z-index: 10;
    width: 100%; max-width: 400px;
    padding: 48px 24px 40px;
    display: flex; flex-direction: column; align-items: center;
  }

  .tagline {
    font-family: 'Cinzel', serif; font-size: 11px;
    letter-spacing: 0.35em; color: var(--gold-dim);
    text-transform: uppercase; margin-bottom: 6px; text-align: center;
  }
  .rune-row {
    font-family: 'Cinzel', serif; font-size: 13px;
    letter-spacing: 0.2em; color: rgba(201,168,76,0.35);
    margin-bottom: 20px; text-align: center;
  }
  .hero-title {
    font-family: 'Cinzel Decorative', serif; font-size: 42px;
    font-weight: 700; line-height: 1.1; text-align: center;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.6), 0 0 80px rgba(201,168,76,0.2);
    margin-bottom: 4px; letter-spacing: 0.05em;
  }
  .hero-sub {
    font-family: 'Cinzel Decorative', serif; font-size: 32px;
    font-weight: 700; line-height: 1.1; text-align: center;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.6), 0 0 80px rgba(201,168,76,0.2);
    margin-bottom: 28px; letter-spacing: 0.05em;
  }
  .divider {
    width: 80%; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    margin-bottom: 24px;
  }
  .animated-text {
    font-family: 'Crimson Text', serif; font-style: italic;
    font-size: 17px; color: rgba(201,168,76,0.75);
    text-align: center; margin-bottom: 32px;
    letter-spacing: 0.05em; min-height: 26px;
    transition: opacity 0.5s ease;
  }
  .input-wrap { width: 100%; margin-bottom: 32px; }
  .question-input {
    width: 100%; background: rgba(10,6,25,0.75);
    border: 1px solid rgba(201,168,76,0.4); border-radius: 4px;
    padding: 14px 18px; font-family: 'Crimson Text', serif;
    font-size: 16px; color: #e8d8c0; outline: none;
    text-align: center; letter-spacing: 0.03em;
    transition: border-color 0.3s, box-shadow 0.3s;
    resize: none; caret-color: var(--gold);
  }
  .question-input::placeholder { color: rgba(201,168,76,0.35); font-style: italic; }
  .question-input:focus { border-color: rgba(201,168,76,0.7); box-shadow: 0 0 20px rgba(201,168,76,0.1); }

  .choose-label {
    font-family: 'Cinzel', serif; font-size: 12px;
    letter-spacing: 0.3em; color: var(--gold-dim);
    text-transform: uppercase; margin-bottom: 16px; text-align: center;
  }
  .spreads { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .spread-btn {
    width: 100%; padding: 14px 20px;
    background: rgba(10,6,25,0.6);
    border: 1px solid rgba(201,168,76,0.35); border-radius: 4px;
    cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; transition: all 0.25s ease;
  }
  .spread-btn:hover, .spread-btn:active {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }
  .spread-btn.loading { opacity: 0.5; pointer-events: none; }

  .spread-btn-left { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .spread-name {
    font-family: 'Cinzel', serif; font-size: 13px;
    font-weight: 600; letter-spacing: 0.15em;
    color: var(--gold); text-transform: uppercase;
  }
  .spread-desc { font-family: 'Crimson Text', serif; font-size: 13px; color: rgba(201,168,76,0.55); letter-spacing: 0.05em; }
  .spread-price { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold-dim); letter-spacing: 0.05em; white-space: nowrap; }
  .spread-price .coin {
    display: inline-block; width: 16px; height: 16px;
    vertical-align: middle; border-radius: 50%;
    margin-left: 2px; position: relative; top: -1px;
  }

  .topup-link {
    margin-top: 24px; font-family: 'Cinzel', serif;
    font-size: 11px; letter-spacing: 0.25em; color: var(--gold-dim);
    text-transform: uppercase; text-decoration: none;
    border-bottom: 1px solid rgba(201,168,76,0.3);
    padding-bottom: 2px; cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .topup-link:hover { color: var(--gold); border-color: rgba(201,168,76,0.7); }

  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(201,168,76,0.15);
    border: 1px solid rgba(201,168,76,0.5);
    backdrop-filter: blur(10px); border-radius: 12px;
    padding: 12px 24px; font-family: 'Cinzel', serif;
    font-size: 12px; letter-spacing: 0.15em; color: var(--gold);
    white-space: nowrap; z-index: 200; opacity: 0;
    pointer-events: none; transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page">
  <div class="bg-layer"></div>
  <div class="helmet-layer">
    <img src="https://ponck33kg-ux.github.io/rune_mini_app/helmet.png" alt="">
  </div>
  <div class="fire-layer">
    <img src="https://ponck33kg-ux.github.io/rune_mini_app/fire.png" alt="">
  </div>
  <canvas class="sparks-container" id="sparks"></canvas>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <div class="content">
    <div class="tagline">ОРАКУЛ · РУНЫ · СУДЬБА</div>
    <div class="rune-row">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗ</div>
    <div class="hero-title">УЗНАЙ</div>
    <div class="hero-sub">БУДУЩЕЕ</div>
    <div class="divider"></div>
    <div class="animated-text" id="animated-text">Знаки проявляются...</div>

    <div class="input-wrap">
      <textarea class="question-input" id="question" rows="2" maxlength="500" placeholder="Напиши вопрос здесь"></textarea>
    </div>

    <div class="choose-label">Выбери расклад</div>

    <div class="spreads">
      <button class="spread-btn" id="btn-single" onclick="startSpread('single')">
        <div class="spread-btn-left">
          <span class="spread-name">Искра Футарка</span>
          <span class="spread-desc">1 руна · мудрость предков</span>
        </div>
        <span class="spread-price">1 <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета"></span>
      </button>

      <button class="spread-btn" id="btn-triple" onclick="startSpread('triple')">
        <div class="spread-btn-left">
          <span class="spread-name">Тень Иггдрасиль</span>
          <span class="spread-desc">3 руны · прошлое, настоящее, будущее</span>
        </div>
        <span class="spread-price" id="triple-price">бесплатно / 3 <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета"></span>
      </button>

      <button class="spread-btn" id="btn-five" onclick="startSpread('five')">
        <div class="spread-btn-left">
          <span class="spread-name">Слово Одина</span>
          <span class="spread-desc">5 рун · глубокий расклад</span>
        </div>
        <span class="spread-price">5 <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета"></span>
      </button>
    </div>

    <a class="topup-link" href="cashier.html">
      <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета"> Пополнить баланс
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BACKEND = 'https://runebot-production.up.railway.app';
const MINIAPP  = 'https://ponck33kg-ux.github.io/rune_mini_app';

const texts = [
  'Знаки проявляются...','Духи советуются...','Руны открывают путь...',
  'Норны прядут нить...','Древние говорят...','Один слышит тебя...',
];
let ti = 0;
const textEl = document.getElementById('animated-text');
function rotateText() {
  textEl.style.opacity = '0';
  setTimeout(() => { ti = (ti+1) % texts.length; textEl.textContent = texts[ti]; textEl.style.opacity = '1'; }, 500);
}
setInterval(rotateText, 3000);

const canvas = document.getElementById('sparks');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.8; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const sparks = [];
function spawnSpark() {
  const x = window.innerWidth * 0.3 + Math.random() * window.innerWidth * 0.4;
  const size = Math.random() * 2.5 + 0.5;
  const colors = ['rgba(255,183,0,','rgba(255,120,20,','rgba(255,220,80,','rgba(255,100,10,'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  sparks.push({ x, y: canvas.height, size, color, vx: (Math.random()-0.5)*1.2, vy: -(Math.random()*3+2), life: 1, decay: Math.random()*0.008+0.005 });
}
function animateSparks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (Math.random() < 0.35) spawnSpark();
  for (let i = sparks.length-1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vx += (Math.random()-0.5)*0.15; s.vy *= 0.995; s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fillStyle = s.color + s.life + ')'; ctx.fill();
    if (s.life > 0.6) {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size*2.5, 0, Math.PI*2);
      ctx.fillStyle = s.color + (s.life*0.15) + ')'; ctx.fill();
    }
  }
  requestAnimationFrame(animateSparks);
}
animateSparks();

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function startSpread(type) {
  const question = document.getElementById('question').value.trim();
  if (!question) {
    const inp = document.getElementById('question');
    inp.focus();
    inp.placeholder = '⚡ Сначала напиши вопрос...';
    setTimeout(() => { inp.placeholder = 'Напиши вопрос здесь'; }, 2000);
    return;
  }

  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) {
    showToast('Открой через Telegram');
    return;
  }

  const btn = document.getElementById('btn-' + type);
  if (btn) btn.classList.add('loading');

  try {
    const res = await fetch(`${BACKEND}/cast`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: tg.initData, spread_type: type, situation: question }),
    });
    const data = await res.json();

    if (!data.ok) {
      if (data.error === 'no_coins') {
        showToast('Недостаточно монет — пополни баланс');
      } else {
        showToast('Ошибка: ' + (data.error || 'попробуй снова'));
      }
      return;
    }
    const encoded = encodeURIComponent(tg.initData);
    let url = '';
    if (type === 'single') {
      const r = data.runes[0];
      url = `casting_single.html?rune=${encodeURIComponent(r.name_ru)}&reversed=${r.reversed?1:0}&text=${encodeURIComponent(data.text)}&situation=${encodeURIComponent(question)}&spread=single&init_data=${encoded}`;
    } else if (type === 'triple') {
      url = `casting_triple.html?` +
        data.runes.map((r,i) => `rune${i+1}=${encodeURIComponent(r.name_ru)}&reversed${i+1}=${r.reversed?1:0}`).join('&') +
        `&text=${encodeURIComponent(data.text)}&situation=${encodeURIComponent(question)}&spread=triple&init_data=${encoded}`;
    } else if (type === 'five') {
      url = `casting_five.html?` +
        data.runes.map((r,i) => `rune${i+1}=${encodeURIComponent(r.name_ru)}&reversed${i+1}=${r.reversed?1:0}`).join('&') +
        `&text=${encodeURIComponent(data.text)}&situation=${encodeURIComponent(question)}&spread=five&init_data=${encoded}`;
    }

    window.location.href = url;

  } catch (e) {
    showToast('Ошибка соединения');
  } finally {
    if (btn) btn.classList.remove('loading');
  }
}

const urlParams = new URLSearchParams(window.location.search);
const freeAvailable = urlParams.get('free') === '1';
function updateFreeLabel() {
  const priceEl = document.getElementById('triple-price');
  if (priceEl) {
    priceEl.innerHTML = freeAvailable
      ? 'бесплатно / 3 <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета">'
      : '3 <img class="coin" src="https://raw.githubusercontent.com/ponck33kg-ux/rune_mini_app/main/coin.png" alt="монета">';
  }
}
updateFreeLabel();

if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
