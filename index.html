<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rune Oracle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-bright: #FFB700;
    --gold-dim: #8a6e2f;
    --fire-orange: #ff6b1a;
    --fire-yellow: #ffd700;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    background: #0d0820;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* ── Фон ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    background-image: url('https://ponck33kg-ux.github.io/rune_mini_app/mini_app_Full_Content_%D1%84%D0%BE%D0%BD.png');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  /* ── Шлем ── */
  .-layer {
    position: fixed;
    inset: 0;
    background-image: url('https://ponck33kg-ux.github.io/rune_mini_app/.png');
    background-size: cover;
    background-position: center top;
    opacity: 0.3;
    z-index: 1;
    mix-blend-mode: luminosity;
  }

  /* ── Огонь ── */
  .fire-layer {
    position: fixed;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 120%;
    max-width: 500px;
    z-index: 2;
    pointer-events: none;
  }

  .fire-layer img {
    width: 100%;
    opacity: 0.45;
    animation: fire-flicker 2s ease-in-out infinite alternate;
    filter: saturate(1.3) brightness(1.1);
    mix-blend-mode: screen;
  }

  @keyframes fire-flicker {
    0%   { transform: scaleX(1) scaleY(1); opacity: 0.4; }
    25%  { transform: scaleX(1.03) scaleY(1.02); opacity: 0.48; }
    50%  { transform: scaleX(0.98) scaleY(1.04); opacity: 0.45; }
    75%  { transform: scaleX(1.02) scaleY(0.99); opacity: 0.5; }
    100% { transform: scaleX(1) scaleY(1.03); opacity: 0.42; }
  }

  /* ── Искры ── */
  .sparks-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80vh;
    pointer-events: none;
    z-index: 3;
  }

  .spark {
    position: absolute;
    border-radius: 50%;
    animation: spark-rise var(--duration) ease-out forwards;
    opacity: 0;
  }

  @keyframes spark-rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0.9; }
    30%  { opacity: 0.8; }
    70%  { opacity: 0.4; }
    100% { transform: translateY(var(--rise)) translateX(var(--drift)) scale(0.2); opacity: 0; }
  }

  /* ── Затемнение сверху ── */
  .overlay-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 40%;
    background: linear-gradient(to bottom, rgba(8,4,20,0.7) 0%, transparent 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* ── Затемнение снизу ── */
  .overlay-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    background: linear-gradient(to top, rgba(8,4,20,0.85) 0%, transparent 100%);
    z-index: 4;
    pointer-events: none;
  }

  /* ── Контент ── */
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 400px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 48px;
    padding-bottom: 48px;
  }

  /* ── Шапка ── */
  .tagline {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
    text-align: center;
  }

  .rune-row {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: rgba(201,168,76,0.35);
    margin-bottom: 20px;
    text-align: center;
  }

  /* ── Заголовок ── */
  .hero-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 42px;
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
    color: var(--gold);
    text-shadow:
      0 0 40px rgba(201,168,76,0.6),
      0 0 80px rgba(201,168,76,0.2);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .hero-sub {
    font-family: 'Cinzel Decorative', serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
    color: var(--gold);
    text-shadow:
      0 0 40px rgba(201,168,76,0.6),
      0 0 80px rgba(201,168,76,0.2);
    margin-bottom: 28px;
    letter-spacing: 0.05em;
  }

  /* ── Разделитель ── */
  .divider {
    width: 80%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
    margin-bottom: 24px;
  }

  /* ── Анимированный текст ── */
  .animated-text {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: 17px;
    color: rgba(201,168,76,0.75);
    text-align: center;
    margin-bottom: 32px;
    letter-spacing: 0.05em;
    min-height: 26px;
    transition: opacity 0.5s ease;
  }

  /* ── Поле ввода ── */
  .input-wrap {
    width: 100%;
    margin-bottom: 32px;
  }

  .question-input {
    width: 100%;
    background: rgba(10,6,25,0.75);
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    color: #e8d8c0;
    outline: none;
    text-align: center;
    letter-spacing: 0.03em;
    transition: border-color 0.3s, box-shadow 0.3s;
    resize: none;
    caret-color: var(--gold);
  }

  .question-input::placeholder {
    color: rgba(201,168,76,0.35);
    font-style: italic;
  }

  .question-input:focus {
    border-color: rgba(201,168,76,0.7);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }

  /* ── Выбери расклад ── */
  .choose-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }

  /* ── Кнопки раскладов ── */
  .spreads {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .spread-btn {
    width: 100%;
    padding: 14px 20px;
    background: rgba(10,6,25,0.6);
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.25s ease;
    text-decoration: none;
  }

  .spread-btn:hover, .spread-btn:active {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.6);
    box-shadow: 0 0 20px rgba(201,168,76,0.1);
  }

  .spread-btn-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }

  .spread-name {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .spread-desc {
    font-family: 'Crimson Text', serif;
    font-size: 13px;
    color: rgba(201,168,76,0.55);
    letter-spacing: 0.05em;
  }

  .spread-price {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--gold-dim);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .spread-price .star {
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="page">
  <div class="bg-layer"></div>
  <div class="-layer"></div>

  <div class="fire-layer">
    <img src="https://ponck33kg-ux.github.io/rune_mini_app/fire.png" alt="">
  </div>

  <canvas class="sparks-container" id="sparks"></canvas>

  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <div class="content">
    <div class="tagline">ОРАКУЛ · РУНЫ · СУДЬБА</div>
    <div class="rune-row">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗ</div>

    <div class="hero-title">УЗНАЙ</div>
    <div class="hero-sub">БУДУЩЕЕ</div>

    <div class="divider"></div>

    <div class="animated-text" id="animated-text">Знаки проявляются...</div>

    <div class="input-wrap">
      <textarea
        class="question-input"
        id="question"
        rows="2"
        placeholder="Напиши вопрос здесь"
      ></textarea>
    </div>

    <div class="choose-label">Выбери расклад</div>

    <div class="spreads">
      <button class="spread-btn" onclick="startSpread('single')">
        <div class="spread-btn-left">
          <span class="spread-name">Искра Футарка</span>
          <span class="spread-desc">1 руна · быстрый ответ</span>
        </div>
        <span class="spread-price">бесплатно / 2 <span class="star">⭐</span></span>
      </button>

      <button class="spread-btn" onclick="startSpread('triple')">
        <div class="spread-btn-left">
          <span class="spread-name">Тень Иггдрасиль</span>
          <span class="spread-desc">3 руны · прошлое, настоящее, будущее</span>
        </div>
        <span class="spread-price">6 <span class="star">⭐</span></span>
      </button>

      <button class="spread-btn" onclick="startSpread('five')">
        <div class="spread-btn-left">
          <span class="spread-name">Слово Одина</span>
          <span class="spread-desc">5 рун · глубокий расклад</span>
        </div>
        <span class="spread-price">10 <span class="star">⭐</span></span>
      </button>
    </div>
  </div>
</div>

<script>
  // ── Анимированный текст ──
  const texts = [
    'Знаки проявляются...',
    'Духи советуются...',
    'Руны открывают путь...',
    'Норны прядут нить...',
    'Древние говорят...',
    'Один слышит тебя...',
  ];
  let ti = 0;
  const textEl = document.getElementById('animated-text');

  function rotateText() {
    textEl.style.opacity = '0';
    setTimeout(() => {
      ti = (ti + 1) % texts.length;
      textEl.textContent = texts[ti];
      textEl.style.opacity = '1';
    }, 500);
  }
  setInterval(rotateText, 3000);

  // ── Искры (canvas) ──
  const canvas = document.getElementById('sparks');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.8;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const sparks = [];

  function spawnSpark() {
    const x = window.innerWidth * 0.3 + Math.random() * window.innerWidth * 0.4;
    const size = Math.random() * 2.5 + 0.5;
    const colors = [
      `rgba(255,183,0,`,
      `rgba(255,120,20,`,
      `rgba(255,220,80,`,
      `rgba(255,100,10,`,
    ];
    const color = colors[Math.floor(Math.random() * colors.length)];
    sparks.push({
      x,
      y: canvas.height,
      size,
      color,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(Math.random() * 3 + 2),
      life: 1,
      decay: Math.random() * 0.008 + 0.005,
    });
  }

  function animateSparks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (Math.random() < 0.35) spawnSpark();

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vx += (Math.random() - 0.5) * 0.15;
      s.vy *= 0.995;
      s.life -= s.decay;

      if (s.life <= 0) {
        sparks.splice(i, 1);
        continue;
      }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = s.color + s.life + ')';
      ctx.fill();

      if (s.life > 0.6) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = s.color + (s.life * 0.15) + ')';
        ctx.fill();
      }
    }

    requestAnimationFrame(animateSparks);
  }
  animateSparks();

  // ── Логика кнопок ──
  function startSpread(type) {
    const question = document.getElementById('question').value.trim();
    if (!question) {
      document.getElementById('question').focus();
      document.getElementById('question').placeholder = '⚡ Сначала напиши вопрос...';
      setTimeout(() => {
        document.getElementById('question').placeholder = 'Напиши вопрос здесь';
      }, 2000);
      return;
    }

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.sendData(JSON.stringify({ action: 'spread', spread_type: type, situation: question }));
    }
  }

  // Telegram WebApp init
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>
</body>
</html>
