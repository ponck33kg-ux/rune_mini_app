<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Слово Одина</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  background: #0a0514;
  font-family: 'Georgia', serif;
}

.screen {
  position: relative;
  width: 360px;
  min-height: 100vh;
  overflow: hidden;
  background: #0d0a1a;
}

.bg {
  position: absolute; inset: 0;
  background-image: url('odin.jpg');
  background-size: cover;
  background-position: center top;
  z-index: 0;
}

.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(5,3,15,0.2) 0%, rgba(5,3,15,0.5) 60%, rgba(5,3,15,0.92) 100%);
  z-index: 2;
}

.content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding-bottom: 40px;
}

.top-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 28px 20px 0;
}

.title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #c9a227;
  text-shadow: 0 0 20px rgba(201,162,39,0.8), 0 0 40px rgba(201,162,39,0.4);
  text-transform: uppercase;
  margin-bottom: 24px;
  text-align: center;
}

.rune-ticker {
  width: 100%;
  overflow: hidden;
  height: 36px;
  display: flex;
  align-items: center;
  margin-bottom: 24px;
}

.ticker-inner {
  display: flex;
  gap: 18px;
  white-space: nowrap;
  color: rgba(201,162,39,0.5);
  font-size: 22px;
  animation: ticker 4s linear infinite;
}

@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.center-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 300px;
  padding: 0 12px;
}

.cross-layout {
  display: grid;
  grid-template-columns: 90px 90px 90px;
  grid-template-rows: 90px 90px 90px;
  gap: 8px;
  align-items: center;
  justify-items: center;
}

.cross-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cross-cell.empty { visibility: hidden; }

.rune-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.rune-pos-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: rgba(201,162,39,0.5);
  text-transform: uppercase;
  margin-bottom: 5px;
  text-align: center;
}

.rune-reveal-wrap {
  position: relative;
  width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rune-glow-ring {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(201,162,39,0.22) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 1.2s ease;
}

.rune-glow-ring.active {
  opacity: 1;
  animation: glow-breathe 3.5s ease-in-out infinite;
}

@keyframes glow-breathe {
  0%,100% { transform: scale(0.92); opacity: 0.6; }
  50%     { transform: scale(1.08); opacity: 1; }
}

.rune-img {
  width: 72px;
  height: 72px;
  object-fit: contain;
  opacity: 0;
  filter:
    drop-shadow(0 0 12px rgba(201,162,39,0.9))
    drop-shadow(0 0 26px rgba(201,162,39,0.4))
    brightness(1.2);
  position: relative;
  z-index: 2;
}

.rune-img.appeared {
  animation: rune-appear 1.4s cubic-bezier(0.16,1,0.3,1) forwards,
             rune-levitate 4s 1.4s ease-in-out infinite;
}

.rune-img.reversed { transform: rotate(180deg); }
.rune-img.reversed.appeared {
  animation: rune-appear-rev 1.4s cubic-bezier(0.16,1,0.3,1) forwards,
             rune-levitate-rev 4s 1.4s ease-in-out infinite;
}

@keyframes rune-appear {
  from { opacity: 0; transform: scale(0.6) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes rune-appear-rev {
  from { opacity: 0; transform: scale(0.6) translateY(16px) rotate(180deg); }
  to   { opacity: 1; transform: scale(1) translateY(0) rotate(180deg); }
}

@keyframes rune-levitate {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-7px); }
}

@keyframes rune-levitate-rev {
  0%,100% { transform: rotate(180deg) translateY(0); }
  50%     { transform: rotate(180deg) translateY(-7px); }
}

.bottom-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 0 20px;
  position: relative;
  top: -40px;
}

.runes-names {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
  min-height: 22px;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.runes-names.visible { opacity: 1; }

.rune-name-item {
  font-size: 11px;
  letter-spacing: 1.2px;
  color: #c9a227;
  text-shadow: 0 0 10px rgba(201,162,39,0.6);
  text-transform: uppercase;
  text-align: center;
}

.rune-name-sep {
  color: rgba(201,162,39,0.3);
  font-size: 11px;
}

.text-block {
  width: 100%;
  border-radius: 16px;
  border: 1px solid rgba(201,162,39,0.5);
  background: rgba(5,3,15,0.55);
  padding: 18px 16px;
  min-height: 120px;
  color: rgba(255,255,255,0.9);
  font-size: 15px;
  line-height: 1.7;
  text-align: center;
  box-shadow: inset 0 0 20px rgba(201,162,39,0.05), 0 0 20px rgba(201,162,39,0.1);
}

.text-block.placeholder { color: rgba(255,255,255,0.25); font-style: italic; }

.repeat-btn {
  margin-top: 20px;
  padding: 14px 40px;
  background: rgba(201,162,39,0.15);
  border: 1px solid rgba(201,162,39,0.6);
  border-radius: 50px;
  color: #c9a227;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: 'Georgia', serif;
  text-transform: uppercase;
  transition: background 0.2s;
  display: none;
}

.repeat-btn:hover { background: rgba(201,162,39,0.25); }
.repeat-btn.visible { display: block; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="top-section">
      <div class="title">Слово Одина</div>
      <div class="rune-ticker">
        <div class="ticker-inner" id="ticker">
          ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
          ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
        </div>
      </div>
    </div>

    <div class="center-section">
      <div class="cross-layout">

        <!-- Ряд 1: пусто, Верх (rune3), пусто -->
        <div class="cross-cell empty"></div>
        <div class="cross-cell">
          <div class="rune-pos-label">Потенциал</div>
          <div class="rune-reveal-wrap">
            <div class="rune-glow-ring" id="glow-3"></div>
            <img class="rune-img" id="rune-3" src="stones/Fehu.png" />
          </div>
        </div>
        <div class="cross-cell empty"></div>

        <!-- Ряд 2: Лево (rune2), Центр (rune1), Право (rune5) -->
        <div class="cross-cell">
          <div class="rune-pos-label">Прошлое</div>
          <div class="rune-reveal-wrap">
            <div class="rune-glow-ring" id="glow-2"></div>
            <img class="rune-img" id="rune-2" src="stones/Fehu.png" />
          </div>
        </div>
        <div class="cross-cell">
          <div class="rune-pos-label">Суть</div>
          <div class="rune-reveal-wrap">
            <div class="rune-glow-ring" id="glow-1"></div>
            <img class="rune-img" id="rune-1" src="stones/Fehu.png" />
          </div>
        </div>
        <div class="cross-cell">
          <div class="rune-pos-label">Итог</div>
          <div class="rune-reveal-wrap">
            <div class="rune-glow-ring" id="glow-5"></div>
            <img class="rune-img" id="rune-5" src="stones/Fehu.png" />
          </div>
        </div>

        <!-- Ряд 3: пусто, Низ (rune4), пусто -->
        <div class="cross-cell empty"></div>
        <div class="cross-cell">
          <div class="rune-pos-label">Препятствие</div>
          <div class="rune-reveal-wrap">
            <div class="rune-glow-ring" id="glow-4"></div>
            <img class="rune-img" id="rune-4" src="stones/Fehu.png" />
          </div>
        </div>
        <div class="cross-cell empty"></div>

      </div>
    </div>

    <div class="bottom-section">
      <div class="runes-names" id="runes-names"></div>
      <div class="text-block placeholder" id="text-block">Руны открывают путь...</div>
      <button class="repeat-btn" id="repeat-btn">Бросить снова</button>
    </div>
  </div>
</div>

<script>
const ticker     = document.getElementById('ticker');
const textBlock  = document.getElementById('text-block');
const repeatBtn  = document.getElementById('repeat-btn');
const runesNames = document.getElementById('runes-names');

function setTickerSpeed(s) { ticker.style.animationDuration = s + 's'; }

function accelerate(cb) {
  let speed = 4;
  setTickerSpeed(speed);
  let i = 0;
  const interval = setInterval(() => {
    i++;
    speed = Math.max(0.25, speed * 0.8);
    setTickerSpeed(speed);
    if (i >= 22) { clearInterval(interval); cb(); }
  }, 130);
}

const runeFileMap = {
  'Феху':'Fehu','Уруз':'Uruz','Турисаз':'Thurisaz','Ансуз':'Ansuz',
  'Райдо':'Raidho','Кано':'Kaunan','Гебо':'Gebo','Вуньо':'Wunjo',
  'Хагалаз':'Hagalaz','Наутиз':'Nauthiz','Иса':'Isa','Йера':'Jera',
  'Эйваз':'Eihwaz','Перт':'Perthro','Альгиз':'Algiz','Соулу':'Sowilo',
  'Тейваз':'Tiwaz','Беркана':'Berkana','Эваз':'Ehwaz','Манназ':'Mannaz',
  'Лагуз':'Laguz','Ингуз':'Ingwaz','Одал':'Othalan','Дагаз':'Dagaz'
};

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const runes = [1,2,3,4,5].map(i => ({
    name:     p.get(`rune${i}`) || '',
    reversed: p.get(`reversed${i}`) === '1',
    file:     runeFileMap[p.get(`rune${i}`) || ''] || null,
  }));
  const text = p.get('text') || '';
  return { runes, text };
}

function runCasting(params) {
  repeatBtn.classList.remove('visible');
  textBlock.classList.add('placeholder');
  textBlock.textContent = '...';
  runesNames.classList.remove('visible');
  runesNames.innerHTML = '';

  [1,2,3,4,5].forEach(i => {
    const img  = document.getElementById(`rune-${i}`);
    const glow = document.getElementById(`glow-${i}`);
    img.classList.remove('appeared', 'reversed');
    img.style.opacity = '0';
    glow.classList.remove('active');
  });

  accelerate(() => {
    setTickerSpeed(4);

    params.runes.forEach((rune, idx) => {
      const i    = idx + 1;
      const img  = document.getElementById(`rune-${i}`);
      const glow = document.getElementById(`glow-${i}`);
      img.src = rune.file ? `stones/${rune.file}.png` : 'stones/Fehu.png';
      if (rune.reversed) img.classList.add('reversed');
      img.classList.add('appeared');
      setTimeout(() => glow.classList.add('active'), 600);
    });

    setTimeout(() => {
      runesNames.innerHTML = params.runes.map((r, idx) => {
        const label = r.reversed ? r.name + ' 🔄' : r.name;
        return (idx > 0 ? '<span class="rune-name-sep"> · </span>' : '') +
               `<span class="rune-name-item">${label}</span>`;
      }).join('');
      runesNames.classList.add('visible');
    }, 900);

    setTimeout(() => {
      textBlock.classList.remove('placeholder');
      textBlock.textContent = params.text || 'Толкование не получено.';
      repeatBtn.classList.add('visible');
    }, 1600);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const params = getParams();
  setTimeout(() => runCasting(params), 600);
});

repeatBtn.addEventListener('click', () => {
  // TODO: раскомментировать вызов инвоиса Telegram Stars
  // Telegram.WebApp.openInvoice(invoiceUrl, (status) => {
  //   if (status === 'paid') runCasting(getParams());
  // });
  runCasting(getParams());
});
</script>
</body>
</html>
