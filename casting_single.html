<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Искра Футарка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  background: #0a0514;
  font-family: 'Georgia', serif;
}

.screen {
  position: relative;
  width: 360px;
  min-height: 100vh;
  overflow: hidden;
  background: #1a0d2e;
}

.bg {
  position: absolute; inset: 0;
  background-image: url('bg.png');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.valkyrie {
  position: absolute; inset: 0;
  background-image: url('Valkyrie.png');
  background-size: cover;
  background-position: center top;
  opacity: 0.75;
  z-index: 1;
}

.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(10,5,20,0.1) 0%, rgba(10,5,20,0.5) 60%, rgba(10,5,20,0.85) 100%);
  z-index: 2;
}

.content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px 40px;
  min-height: 100vh;
}

.title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #c9a227;
  text-shadow: 0 0 20px rgba(201,162,39,0.8), 0 0 40px rgba(201,162,39,0.4);
  text-transform: uppercase;
  margin-bottom: 24px;
  text-align: center;
}

.rune-ticker {
  width: 100%;
  overflow: hidden;
  height: 36px;
  display: flex;
  align-items: center;
  margin-bottom: 24px;
}

.ticker-inner {
  display: flex;
  gap: 18px;
  white-space: nowrap;
  color: rgba(201,162,39,0.5);
  font-size: 22px;
  animation: ticker 4s linear infinite;
}

@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.rune-block-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.rune-reveal-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rune-glow-ring {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(201,162,39,0.25) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 1.2s ease;
}

.rune-glow-ring.active {
  opacity: 1;
  animation: glow-breathe 3.5s ease-in-out infinite;
}

@keyframes glow-breathe {
  0%,100% { transform: scale(0.92); opacity: 0.6; }
  50% { transform: scale(1.08); opacity: 1; }
}

.rune-img {
  width: 160px;
  height: 160px;
  object-fit: contain;
  opacity: 0;
  filter:
    drop-shadow(0 0 18px rgba(201,162,39,0.95))
    drop-shadow(0 0 40px rgba(201,162,39,0.5))
    brightness(1.2);
  position: relative;
  z-index: 2;
}

.rune-img.appeared {
  animation: rune-appear 1.4s cubic-bezier(0.16,1,0.3,1) forwards,
             rune-levitate 4s 1.4s ease-in-out infinite;
}

.rune-img.reversed { transform: rotate(180deg); }
.rune-img.reversed.appeared {
  animation: rune-appear-rev 1.4s cubic-bezier(0.16,1,0.3,1) forwards,
             rune-levitate-rev 4s 1.4s ease-in-out infinite;
}

@keyframes rune-appear {
  from { opacity: 0; transform: scale(0.6) translateY(30px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes rune-appear-rev {
  from { opacity: 0; transform: scale(0.6) translateY(30px) rotate(180deg); }
  to   { opacity: 1; transform: scale(1) translateY(0) rotate(180deg); }
}

@keyframes rune-levitate {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-10px); }
}

@keyframes rune-levitate-rev {
  0%,100% { transform: rotate(180deg) translateY(0); }
  50%     { transform: rotate(180deg) translateY(-10px); }
}

.rune-name {
  font-size: 18px;
  letter-spacing: 2px;
  color: #c9a227;
  text-shadow: 0 0 12px rgba(201,162,39,0.6);
  text-transform: uppercase;
  min-height: 26px;
  margin-bottom: 16px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.rune-name.visible { opacity: 1; }

.text-block {
  width: 100%;
  border-radius: 16px;
  border: 1px solid rgba(201,162,39,0.5);
  background: rgba(10,5,20,0.45);
  padding: 18px 16px;
  min-height: 120px;
  color: rgba(255,255,255,0.9);
  font-size: 15px;
  line-height: 1.7;
  text-align: center;
  box-shadow: inset 0 0 20px rgba(201,162,39,0.05), 0 0 20px rgba(201,162,39,0.1);
  margin-bottom: 0;
}

.text-block.placeholder { color: rgba(255,255,255,0.25); font-style: italic; }

.start-btn { display: none; }

.repeat-btn {
  margin-top: 16px;
  padding: 14px 40px;
  background: rgba(201,162,39,0.15);
  border: 1px solid rgba(201,162,39,0.6);
  border-radius: 50px;
  color: #c9a227;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: 'Georgia', serif;
  text-transform: uppercase;
  transition: background 0.2s;
  display: none;
}

.repeat-btn:hover { background: rgba(201,162,39,0.25); }
.repeat-btn.visible { display: block; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <div class="valkyrie"></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="title">Искра Футарка</div>

    <div class="rune-ticker">
      <div class="ticker-inner" id="ticker">
        ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
        ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
      </div>
    </div>

    <div class="rune-block-wrap">
      <div class="rune-reveal-wrap">
        <div class="rune-glow-ring" id="rune-glow"></div>
        <img class="rune-img" id="rune-img" src="stones/Fehu.png" />
      </div>

      <div class="rune-name" id="rune-name"></div>

      <div class="text-block placeholder" id="text-block">
        Руны открывают путь...
      </div>
    </div>

    <button class="start-btn" id="start-btn">Бросить руну</button>
    <button class="repeat-btn" id="repeat-btn">Бросить снова</button>
  </div>
</div>

<script>


const ticker    = document.getElementById('ticker');
const runeImg   = document.getElementById('rune-img');
const runeGlow  = document.getElementById('rune-glow');
const runeName  = document.getElementById('rune-name');
const textBlock = document.getElementById('text-block');
const startBtn  = document.getElementById('start-btn');
const repeatBtn = document.getElementById('repeat-btn');

function setTickerSpeed(s) { ticker.style.animationDuration = s + 's'; }

function accelerate(cb) {
  let speed = 4;
  setTickerSpeed(speed);
  let i = 0;
  const interval = setInterval(() => {
    i++;
    speed = Math.max(0.25, speed * 0.8);
    setTickerSpeed(speed);
    if (i >= 22) { clearInterval(interval); cb(); }
  }, 130);
}

const runeFileMap = {
  'Феху':'Fehu','Уруз':'Uruz','Турисаз':'Thurisaz','Ансуз':'Ansuz',
  'Райдо':'Raidho','Кано':'Kaunan','Гебо':'Gebo','Вуньо':'Wunjo',
  'Хагалаз':'Hagalaz','Наутиз':'Nauthiz','Иса':'Isa','Йера':'Jera',
  'Эйваз':'Eihwaz','Перт':'Perthro','Альгиз':'Algiz','Соулу':'Sowilo',
  'Тейваз':'Tiwaz','Беркана':'Berkana','Эваз':'Ehwaz','Манназ':'Mannaz',
  'Лагуз':'Laguz','Ингуз':'Ingwaz','Одал':'Othalan','Дагаз':'Dagaz'
};

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const name = p.get('rune') || '';
  const reversed = p.get('reversed') === '1';
  const text = p.get('text') || '';
  const file = runeFileMap[name] || null;
  return { name, reversed, text, file };
}

function runCasting(params) {
  repeatBtn.classList.remove('visible');
  textBlock.classList.add('placeholder');
  textBlock.textContent = '...';
  runeName.textContent = '';
  runeName.classList.remove('visible');

  runeImg.classList.remove('appeared', 'reversed');
  runeImg.style.opacity = '0';
  runeGlow.classList.remove('active');

  const imgUrl = params.file ? 'stones/' + params.file + '.png' : 'stones/Fehu.png';
  runeImg.src = imgUrl;

  accelerate(() => {
    setTickerSpeed(4);

    if (params.reversed) runeImg.classList.add('reversed');
    runeImg.classList.add('appeared');

    setTimeout(() => { runeGlow.classList.add('active'); }, 600);

    setTimeout(() => {
      runeName.textContent = params.reversed
        ? params.name + ' (перевёрнута)'
        : params.name;
      runeName.classList.add('visible');
    }, 900);

    setTimeout(() => {
      textBlock.classList.remove('placeholder');
      textBlock.textContent = params.text || 'Толкование не получено.';
      repeatBtn.classList.add('visible');
    }, 1600);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const params = getParams();
  setTimeout(() => runCasting(params), 600);
});

repeatBtn.addEventListener('click', () => {
  // TODO: раскомментировать вызов инвоиса Telegram Stars
  // Telegram.WebApp.openInvoice(invoiceUrl, (status) => {
  //   if (status === 'paid') runCasting(getParams());
  // });

  runCasting(getParams()); // временно — прямой перезапуск для тестирования
});
</script>
</body>
</html>
