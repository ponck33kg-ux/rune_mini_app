<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Искра Футарка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  background: #0a0514;
  font-family: 'Georgia', serif;
}

.screen {
  position: relative;
  width: 360px;
  min-height: 100vh;
  overflow: hidden;
  background: #1a0d2e;
}

.bg {
  position: absolute; inset: 0;
  background-image: url('bg.png');
  background-size: cover;
  background-position: center;
  z-index: 0;
}

.valkyrie {
  position: absolute; inset: 0;
  background-image: url('Valkyrie.png');
  background-size: cover;
  background-position: center top;
  opacity: 0.75;
  z-index: 1;
}

.overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(10,5,20,0.1) 0%, rgba(10,5,20,0.5) 60%, rgba(10,5,20,0.85) 100%);
  z-index: 2;
}

.lightning {
  position: absolute; inset: 0;
  background: rgba(192,215,235,0);
  z-index: 10;
  pointer-events: none;
  transition: background 0.15s ease;
}

.content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px 40px;
  min-height: 100vh;
}

.title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #c9a227;
  text-shadow: 0 0 20px rgba(201,162,39,0.8), 0 0 40px rgba(201,162,39,0.4);
  text-transform: uppercase;
  margin-bottom: 24px;
  text-align: center;
}

.rune-ticker {
  width: 100%;
  overflow: hidden;
  height: 36px;
  display: flex;
  align-items: center;
  margin-bottom: 24px;
}

.ticker-inner {
  display: flex;
  gap: 18px;
  white-space: nowrap;
  color: rgba(201,162,39,0.5);
  font-size: 22px;
  animation: ticker 4s linear infinite;
}

@keyframes ticker {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.rune-block-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.flip-container {
  perspective: 800px;
  width: 180px;
  height: 180px;
  margin-bottom: 14px;
  z-index: 5;
  position: relative;
}

.flipper {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
}

.flipper.flipped { transform: rotateY(180deg); }

.face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}

.face.back { transform: rotateY(180deg); }
.face img { width: 140px; height: 140px; object-fit: contain; }
.face.front img {
  opacity: 0.5;
  filter: grayscale(0.6) brightness(0.7);
}
.face.back img {
  filter:
    drop-shadow(0 0 18px rgba(201,162,39,0.95))
    drop-shadow(0 0 40px rgba(201,162,39,0.6))
    brightness(1.25);
}

.rune-name {
  font-size: 18px;
  letter-spacing: 2px;
  color: #c9a227;
  text-shadow: 0 0 12px rgba(201,162,39,0.6);
  text-transform: uppercase;
  min-height: 26px;
  margin-bottom: 16px;
  text-align: center;
}

.text-block {
  width: 100%;
  border-radius: 16px;
  border: 1px solid rgba(201,162,39,0.5);
  background: rgba(10,5,20,0.45);
  padding: 18px 16px;
  min-height: 120px;
  color: rgba(255,255,255,0.9);
  font-size: 15px;
  line-height: 1.7;
  text-align: center;
  box-shadow: inset 0 0 20px rgba(201,162,39,0.05), 0 0 20px rgba(201,162,39,0.1);
  margin-bottom: 0;
}

.text-block.placeholder { color: rgba(255,255,255,0.25); font-style: italic; }

.start-btn { display: none; }

.repeat-btn {
  margin-top: 16px;
  padding: 14px 40px;
  background: rgba(201,162,39,0.15);
  border: 1px solid rgba(201,162,39,0.6);
  border-radius: 50px;
  color: #c9a227;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  font-family: 'Georgia', serif;
  text-transform: uppercase;
  transition: background 0.2s;
  display: none;
}

.repeat-btn:hover { background: rgba(201,162,39,0.25); }
.repeat-btn.visible { display: block; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg"></div>
  <div class="valkyrie"></div>
  <div class="overlay"></div>
  <div class="lightning" id="lightning"></div>

  <div class="content">
    <div class="title">Искра Футарка</div>

    <div class="rune-ticker">
      <div class="ticker-inner" id="ticker">
        ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
        ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᚾ ᛁ ᛃ ᛇ ᛈ ᛉ ᛊ ᛏ ᛒ ᛖ ᛗ ᛚ ᛜ ᛞ ᛟ
      </div>
    </div>

    <div class="rune-block-wrap">
      <div class="flip-container">
        <div class="flipper" id="flipper">
          <div class="face front">
            <img id="rune-back-img"
              src="stones/Fehu.png"
              style="transform:rotate(180deg);opacity:0.5;filter:grayscale(0.5);" />
          </div>
          <div class="face back">
            <img id="rune-front-img" src="stones/Fehu.png" />
          </div>
        </div>
      </div>

      <div class="rune-name" id="rune-name"></div>

      <div class="text-block placeholder" id="text-block">
        Нажми кнопку — руны откроют путь
      </div>
    </div>

    <button class="start-btn" id="start-btn">Бросить руну</button>
    <button class="repeat-btn" id="repeat-btn">Бросить снова</button>
  </div>
</div>

<script>


const ticker      = document.getElementById('ticker');
const flipper     = document.getElementById('flipper');
const runeBackImg = document.getElementById('rune-back-img');
const runeFrontImg= document.getElementById('rune-front-img');
const runeName    = document.getElementById('rune-name');
const textBlock   = document.getElementById('text-block');
const startBtn    = document.getElementById('start-btn');
const repeatBtn   = document.getElementById('repeat-btn');
const lightning   = document.getElementById('lightning');

function setTickerSpeed(s) { ticker.style.animationDuration = s + 's'; }

function flash(cb) {
  const flashes = [
    {on:300,off:250},{on:200,off:180},{on:150,off:120},{on:400,off:200},{on:100,off:80}
  ];
  let i = 0;
  function next() {
    if (i >= flashes.length) { cb(); return; }
    const f = flashes[i++];
    lightning.style.background = 'rgba(192,215,235,0.55)';
    setTimeout(() => {
      lightning.style.background = 'rgba(192,215,235,0)';
      setTimeout(next, f.off);
    }, f.on);
  }
  next();
}

function accelerate(cb) {
  let speed = 4;
  setTickerSpeed(speed);
  let i = 0;
  const interval = setInterval(() => {
    i++;
    speed = Math.max(0.25, speed * 0.8);
    setTickerSpeed(speed);
    if (i >= 22) { clearInterval(interval); cb(); }
  }, 130);
}

const runeFileMap = {
  'Феху':'Fehu','Уруз':'Uruz','Турисаз':'Thurisaz','Ансуз':'Ansuz',
  'Райдо':'Raidho','Кано':'Kaunan','Гебо':'Gebo','Вуньо':'Wunjo',
  'Хагалаз':'Hagalaz','Наутиз':'Nauthiz','Иса':'Isa','Йера':'Jera',
  'Эйваз':'Eihwaz','Перт':'Perthro','Альгиз':'Algiz','Соулу':'Sowilo',
  'Тейваз':'Tiwaz','Беркана':'Berkana','Эваз':'Ehwaz','Манназ':'Mannaz',
  'Лагуз':'Laguz','Ингуз':'Ingwaz','Одал':'Othalan','Дагаз':'Dagaz'
};

function getParams() {
  const p = new URLSearchParams(window.location.search);
  const name = p.get('rune') || '';
  const reversed = p.get('reversed') === '1';
  const text = p.get('text') || '';
  const file = runeFileMap[name] || null;
  return { name, reversed, text, file };
}

function runCasting(params) {
  repeatBtn.classList.remove('visible');
  textBlock.classList.add('placeholder');
  textBlock.textContent = '...';
  runeName.textContent = '';
  flipper.classList.remove('flipped');

  const imgUrl = params.file
    ? 'stones/' + params.file + '.png'
    : 'stones/Fehu.png';

  runeBackImg.src = imgUrl;
  runeFrontImg.src = imgUrl;
  runeFrontImg.style.transform = params.reversed ? 'rotate(180deg)' : '';

  accelerate(() => {
    flash(() => {
      setTickerSpeed(4);
      runeBackImg.style.transform = 'rotate(180deg)';
      runeBackImg.style.opacity = '0.7';
      runeName.textContent = params.reversed
        ? params.name + ' (перевёрнута)'
        : params.name;

      setTimeout(() => {
        flipper.classList.add('flipped');
        setTimeout(() => {
          textBlock.classList.remove('placeholder');
          textBlock.textContent = params.text || 'Толкование не получено.';
          repeatBtn.classList.add('visible');
        }, 900);
      }, 400);
    });
  });
}

window.addEventListener('DOMContentLoaded', () => {
  const params = getParams();
  setTimeout(() => runCasting(params), 600);
});

repeatBtn.addEventListener('click', () => {
  // TODO: раскомментировать вызов инвоиса Telegram Stars
  // Telegram.WebApp.openInvoice(invoiceUrl, (status) => {
  //   if (status === 'paid') runCasting(getParams());
  // });

  runCasting(getParams()); // временно — прямой перезапуск для тестирования
});
</script>
</body>
</html>
